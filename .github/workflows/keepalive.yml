# Supabase 무료 프로젝트는 7일 동안 접속이 없으면 일시정지됩니다.
# 3일마다 한 번 가볍게 호출해서 깨어 있게 합니다. (공개 키라 비밀값 아님)
name: Supabase keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'   # 3일마다 낮 12시 17분(한국 시간)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS -X POST "https://tzcojnizfwfmmgdqchnm.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_K_Sj8SAwk4Fld2DpqXardg_gNUU9yLn" -H "Content-Type: application/json" -d '{}'
